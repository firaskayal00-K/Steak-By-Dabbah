<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030303">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Steak by Dabbah — Menu Admin</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cinzel:wght@500;600;700&family=Heebo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <noscript><p class="noscript">JavaScript is required for the admin panel.</p></noscript>

  <!-- Sign-in / first-time setup -->
  <div id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card" novalidate>
      <img class="auth-logo" src="/assets/logo-poster.jpg" alt="Steak by Dabbah" width="1280" height="720">
      <div class="auth-langs" id="auth-langs"></div>
      <h1 id="auth-title"></h1>
      <p id="auth-sub" class="muted"></p>
      <label class="field">
        <span class="field-label" id="auth-pw-label"></span>
        <input type="password" id="auth-pw" autocomplete="current-password" required>
      </label>
      <label class="field" id="auth-pw2-wrap" hidden>
        <span class="field-label" id="auth-pw2-label"></span>
        <input type="password" id="auth-pw2" autocomplete="new-password">
      </label>
      <p id="auth-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-gold btn-block" id="auth-submit"></button>
    </form>
  </div>

  <!-- App shell -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">S<span>·</span>D</span>
        <span class="brand-text">
          <strong>Steak by Dabbah</strong>
          <small id="brand-sub"></small>
        </span>
      </a>
      <div class="topbar-actions">
        <div class="history">
          <button type="button" class="icon-btn" id="btn-undo"></button>
          <button type="button" class="icon-btn" id="btn-redo"></button>
        </div>
        <span class="status-pill" id="save-status" role="status" aria-live="polite"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-discard" hidden></button>
        <button type="button" class="btn btn-gold btn-sm" id="btn-save"></button>
        <label class="lang-select" id="ui-lang-wrap">
          <span class="sr-only" id="ui-lang-label"></span>
          <select id="ui-lang">
            <option value="en">EN</option>
            <option value="ar">AR</option>
            <option value="he">HE</option>
          </select>
        </label>
        <button type="button" class="icon-btn" id="btn-logout"></button>
      </div>
    </header>

    <nav class="sidenav" id="sidenav" aria-label="Sections"></nav>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/shared/core.js"></script>
  <script src="/admin/i18n.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
